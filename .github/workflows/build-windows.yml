name: Build Windows (Qt6 + OpenCV + CUDA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Install CUDA Toolkit 12.4 (dev components only)
      shell: pwsh
      run: |
        $url = "https://developer.download.nvidia.com/compute/cuda/12.4.1/network_installers/cuda_12.4.1_windows_network.exe"
        $installer = "$env:TEMP\cuda_installer.exe"
        Write-Host "Downloading CUDA installer..."
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
        Write-Host "Installing CUDA dev components..."
        Start-Process -FilePath $installer -ArgumentList "-s nvcc_12.4 cudart_12.4 cublas_dev_12.4 visual_studio_integration_12.4" -Wait -NoNewWindow
        $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
        echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
        echo "$cudaPath\bin" >> $env:GITHUB_PATH
        if (Test-Path "$cudaPath\bin\nvcc.exe") {
          Write-Host "nvcc OK"
        } else {
          Write-Host "WARNING: nvcc not found"
        }

    - name: Download and install OpenCV 4.10.0 (prebuilt)
      shell: pwsh
      run: |
        Write-Host "Downloading OpenCV 4.10.0 prebuilt for Windows..."
        $url = "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe"
        $installer = "$env:TEMP\opencv-4.10.0-windows.exe"
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
        Write-Host "Extracting OpenCV..."
        Start-Process -FilePath $installer -ArgumentList "-o`"C:\opencv`" -y" -Wait -NoNewWindow
        # Find the actual extracted path
        $opencvBuild = Get-ChildItem "C:\opencv" -Recurse -Filter "OpenCVConfig.cmake" | Select-Object -First 1
        if ($opencvBuild) {
          $opencvDir = $opencvBuild.DirectoryName
          Write-Host "Found OpenCV at: $opencvDir"
          echo "OpenCV_DIR=$opencvDir" >> $env:GITHUB_ENV
          # Add OpenCV bin to PATH for DLLs
          $opencvBin = Join-Path (Split-Path $opencvDir -Parent) "bin"
          if (-not (Test-Path $opencvBin)) {
            $opencvBin = Join-Path (Split-Path (Split-Path $opencvDir -Parent) -Parent) "bin"
          }
          echo "$opencvBin" >> $env:GITHUB_PATH
          echo "OPENCV_BIN=$opencvBin" >> $env:GITHUB_ENV
        } else {
          Write-Host "OpenCVConfig.cmake not found, listing C:\opencv:"
          Get-ChildItem "C:\opencv" -Recurse -Depth 4
          exit 1
        }

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      shell: pwsh
      run: |
        $cudaPath = $env:CUDA_PATH
        cmake -B build -S . `
          -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DENABLE_CUDA=ON `
          -DOpenCV_DIR="$env:OpenCV_DIR" `
          -DCUDA_TOOLKIT_ROOT_DIR="$cudaPath" `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

    - name: Build Release
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel 4

    - name: Deploy Qt DLLs
      shell: pwsh
      run: |
        $exePath = "build\Release\AnalisiVideoSperimentaleAvanzata.exe"
        if (Test-Path $exePath) {
          & "$env:Qt6_DIR\bin\windeployqt.exe" --release --no-translations $exePath
          Write-Host "windeployqt OK"
        } else {
          Write-Host "ERROR: exe not found"
          Get-ChildItem build\Release -ErrorAction SilentlyContinue
          exit 1
        }

    - name: Copy OpenCV and CUDA runtime DLLs
      shell: pwsh
      run: |
        $dest = "build\Release"
        # OpenCV DLLs
        if ($env:OPENCV_BIN -and (Test-Path $env:OPENCV_BIN)) {
          Get-ChildItem "$env:OPENCV_BIN\opencv_world*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force
          Write-Host "Copied OpenCV DLLs"
        }
        # CUDA runtime DLLs
        $cudaBin = "$env:CUDA_PATH\bin"
        if (Test-Path $cudaBin) {
          @("cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll") | ForEach-Object {
            Get-ChildItem "$cudaBin\$_" -ErrorAction SilentlyContinue | Copy-Item -Destination $dest -Force
          }
          Write-Host "Copied CUDA DLLs"
        }

    - name: Create ZIP artifact
      shell: pwsh
      run: |
        Compress-Archive -Path "build\Release\*" -DestinationPath "AVSA-Windows-x64.zip" -Force
        Write-Host "ZIP size: $((Get-Item AVSA-Windows-x64.zip).Length) bytes"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AVSA-Windows-x64
        path: AVSA-Windows-x64.zip
        retention-days: 30
